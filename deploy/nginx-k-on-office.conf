# /etc/nginx/sites-available/k-on-office  (HTTPS is added afterwards by `certbot --nginx`)
server {
    listen 80;
    listen [::]:80;
    server_name kon.example.com;

    client_max_body_size 12m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # --- Serving under a sub-path of a shared domain instead (https://example.com/k-on/) ---
    # Build the frontend with DOE_BASE_PATH=/k-on/ and strip the prefix when proxying. The app itself needs no change.
