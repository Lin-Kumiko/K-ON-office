name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.lock.txt
      - run: python -m pip install -r requirements.lock.txt
      - run: python -m ruff check .
      - run: python -m pytest -q -p no:cacheprovider

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: frontend/dist
          retention-days: 3

  publish:
    # Publishes the bundle; the server pulls it (k-on-pull.timer), so nothing logs in to the server.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: frontend/dist
      - name: Build release bundle
        run: |
          echo "$GITHUB_SHA" > frontend/dist/release.txt
          tar -czf "$RUNNER_TEMP/release.tgz" --exclude='backend/tests' --exclude='__pycache__' \
            backend scripts deploy frontend/dist
          echo "$GITHUB_SHA $(sha256sum "$RUNNER_TEMP/release.tgz" | cut -d' ' -f1)" > "$RUNNER_TEMP/version.txt"
          ls -lh "$RUNNER_TEMP/release.tgz"
      - name: Publish to the server-build release
        run: |
          gh release view server-build >/dev/null 2>&1 || gh release create server-build --prerelease \
            --title "Server build" --notes "Rolling bundle pulled by the server. Not a versioned release."
          # bundle first, metadata last, so the server never sees a version whose bundle is not there yet
          gh release upload server-build "$RUNNER_TEMP/release.tgz" --clobber
          gh release upload server-build "$RUNNER_TEMP/version.txt" --clobber
      - name: Wait for the server to pick it up
        if: vars.DEPLOY_URL != ''
        run: |
          for i in $(seq 1 40); do
            live=$(curl -fsS "${{ vars.DEPLOY_URL }}/release.txt" 2>/dev/null || true)
            if [ "$live" = "$GITHUB_SHA" ]; then echo "live after ~$((i * 15))s"; exit 0; fi
            sleep 15
          done
          echo "server did not report $GITHUB_SHA within 10 minutes (check: journalctl -u k-on-pull)"
          exit 1